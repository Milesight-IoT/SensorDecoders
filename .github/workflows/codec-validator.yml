name: Codec Validator

on:
  push:
    branches:
      - '**'
    paths:
      - '**/*codec*.json'
  pull_request:
    branches:
      - '**'
    paths:
      - '**/*codec*.json'

jobs:
  detect-files:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.changed_files.outputs.files }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed codec files
        id: changed_files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base_sha="$BEFORE_SHA"
          else
            base_sha="HEAD~1"
          fi

          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR "$base_sha" "$HEAD_SHA" -- | grep -E '.*codec.*\.json$' || true)

          # Renames/deletions can include old paths. Keep only files present at HEAD,
          # so a deleted codec path is never passed to the validator.
          CHANGED_FILES=$(printf '%s\n' "$CHANGED_FILES" | while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              printf '%s\n' "$file"
            fi
          done)

          FILES_JSON=$(printf '%s' "$CHANGED_FILES" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "files=$FILES_JSON" >> "$GITHUB_OUTPUT"

  validate:
    needs: detect-files
    if: needs.detect-files.outputs.files != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file: ${{ fromJson(needs.detect-files.outputs.files) }}
      fail-fast: false  # 即使某个文件失败，也继续验证其他文件
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate ${{ matrix.file }}
        id: validate
        uses: FengFuLiu/codec-validator-action@main
        with:
          codec-path: ${{ matrix.file }}
          fail-on-warning: false

  notify:
    needs: [detect-files, validate]
    if: always() && failure() && needs.detect-files.outputs.files != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Send Feishu notification
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ]; then
            echo "Warning: FEISHU_WEBHOOK_URL secret is not configured, skipping notification"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMIT_MSG="${{ github.event.pull_request.title }}"
            COMMIT_URL="${{ github.event.pull_request.html_url }}"
          else
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            COMMIT_URL="${{ github.event.head_commit.url }}"
          fi

          ACTIONS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -sS -X POST "$FEISHU_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{
              \"msg_type\": \"interactive\",
              \"card\": {
                \"config\": { \"wide_screen_mode\": true },
                \"header\": {
                  \"title\": { \"tag\": \"plain_text\", \"content\": \"Codec 校验失败\" },
                  \"template\": \"red\"
                },
                \"elements\": [
                  {
                    \"tag\": \"div\",
                    \"text\": {
                      \"tag\": \"lark_md\",
                      \"content\": \"**仓库:** ${{ github.repository }}\\n**分支:** ${{ github.ref_name }}\\n**作者:** ${{ github.actor }}\\n**提交:** ${COMMIT_MSG}\"
                    }
                  },
                  {
                    \"tag\": \"action\",
                    \"actions\": [
                      {
                        \"tag\": \"button\",
                        \"text\": { \"tag\": \"plain_text\", \"content\": \"查看 Actions\" },
                        \"url\": \"${ACTIONS_URL}\",
                        \"type\": \"primary\"
                      },
                      {
                        \"tag\": \"button\",
                        \"text\": { \"tag\": \"plain_text\", \"content\": \"查看提交/PR\" },
                        \"url\": \"${COMMIT_URL}\"
                      }
                    ]
                  }
                ]
              }
            }"
